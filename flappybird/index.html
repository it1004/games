<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플래피버드 커스텀 에디션 (Flappy Bird Custom)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Jua', 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* Glassmorphism effects */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Pulse glow animation */
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
            50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.9)); }
        }
        .animate-glow {
            animation: glow 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <div class="w-full max-w-5xl flex flex-col lg:flex-row items-center justify-center gap-6 my-auto">

        <!-- Game Screen Section -->
        <div class="relative flex flex-col items-center justify-center w-full max-w-md">
            
            <!-- Top Status Bar -->
            <div class="w-full flex items-center justify-between px-4 py-2 mb-2 glass-card rounded-2xl shadow-xl">
                <div class="flex items-center gap-2">
                    <span class="text-amber-400 text-lg"><i class="fa-solid fa-trophy"></i></span>
                    <span class="text-xs text-slate-300">최고 기록:</span>
                    <span id="bestScoreText" class="text-lg font-bold text-amber-400">0</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="soundToggleBtn" class="text-slate-300 hover:text-white text-lg transition" title="음소거 설정">
                        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <button id="pauseBtn" class="text-slate-300 hover:text-white text-lg transition" title="일시정지">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div class="relative w-full aspect-[3/4] max-h-[75vh] rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-800 bg-slate-900 group">
                
                <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

                <!-- OVERLAY: Start Menu -->
                <div id="startOverlay" class="absolute inset-0 flex flex-col items-center justify-between p-6 glass-card bg-slate-950/80 z-20 text-center transition-all duration-300">
                    <div class="mt-8">
                        <div class="inline-block p-4 rounded-full bg-amber-500/20 text-amber-400 mb-3 animate-glow">
                            <i class="fa-solid fa-dove text-5xl"></i>
                        </div>
                        <h1 class="text-4xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-yellow-200 drop-shadow-md">
                            FLAPPY BIRD
                        </h1>
                        <p class="text-xs text-slate-300 mt-1">커스텀 캐릭터 & 아이템 에디션</p>
                    </div>

                    <div class="my-auto space-y-3 w-full max-w-xs">
                        <button id="startGameBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-xl shadow-lg shadow-emerald-600/30 active:scale-95 transition">
                            <i class="fa-solid fa-play mr-2"></i>게임 시작
                        </button>
                        <p class="text-xs text-slate-400">화면 터치, 클릭 또는 <kbd class="px-2 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-200">Space</kbd> 키로 점프</p>
                        <!-- Item Legend Badge -->
                        <div class="flex items-center justify-center gap-3 pt-1 text-xs text-amber-300 bg-slate-900/60 py-1.5 px-3 rounded-xl border border-amber-500/20">
                            <span>🪙 +2점</span>
                            <span>💎 +5점</span>
                            <span>⭐ +10점</span>

                    </div>

                    <div class="w-full flex justify-around text-xs text-slate-400 border-t border-slate-800 pt-3">

                        <div class="flex items-center gap-1"><i class="fa-solid fa-up-right-and-down-left-from-center text-cyan-400"></i> 크기 조절</div>

                    <button id="restartGameBtn" class="w-full max-w-xs py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-extrabold text-lg shadow-lg shadow-amber-500/20 active:scale-95 transition">

                    <div class="grid grid-cols-4 gap-2">

                            <span class="text-[10px] text-slate-300">클래식</span>

                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="dragon">

                            <span class="text-2xl">🚀</span>
                            <span class="text-[10px] text-slate-300">로켓</span>
                        </button>
                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="ufo">
                            <span class="text-2xl">🛸</span>
                            <span class="text-[10px] text-slate-300">UFO</span>
                        </button>
                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="cat">
                            <span class="text-2xl">😸</span>
                            <span class="text-[10px] text-slate-300">고양이</span>
                        </button>
                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="ghost">
                            <span class="text-2xl">👻</span>
                            <span class="text-[10px] text-slate-300">유령</span>
                        </button>
                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="bat">
                            <span class="text-2xl">🦇</span>
                            <span class="text-[10px] text-slate-300">박쥐</span>
                        </button>
                        <button class="skin-btn glass-btn p-3 rounded-2xl flex flex-col items-center justify-center gap-1" data-skin="unicorn">

                    <div class="flex gap-2">
                        <input type="text" id="customEmojiInput" maxlength="2" placeholder="예: ⚽, 🛸, 🦅" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-center text-lg focus:outline-none focus:border-amber-400">
                        <button id="applyEmojiBtn" class="px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition whitespace-nowrap">

                    <div class="flex justify-between items-center text-xs">
                        <span class="font-semibold text-slate-300"><i class="fa-solid fa-up-right-and-down-left-from-center mr-1 text-cyan-400"></i> 캐릭터 크기</span>

                        <button class="preset-size-btn text-[11px] py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold text-amber-400 border border-amber-500/30" data-size="34">보통</button>
                        <button class="preset-size-btn text-[11px] py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300" data-size="46">크게</button>
                        <button class="preset-size-btn text-[11px] py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300" data-size="60">왕큼</button>

                    <p class="text-[10px] text-slate-400 leading-tight">💡 크기가 작을수록 파이프 통과가 쉬워집니다!</p>
                </div>

                <!-- Special Effects Options -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <label class="text-xs font-semibold text-slate-300">이펙트 궤적</label>
                    <select id="trailSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
                        <option value="bubbles">✨ 반짝이는 거품</option>
                        <option value="fire">🔥 불꽃 파티클</option>
                        <option value="rainbow">🌈 무지개 자국</option>
                        <option value="feathers">🪶 깃털 / 먼지</option>
                        <option value="none">❌ 효과 없음</option>
                    </select>
                </div>

                <!-- Difficulty Select -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <label class="text-xs font-semibold text-slate-300">게임 난이도</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="diff-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300" data-diff="easy">쉬움</button>
                        <button class="diff-btn py-1.5 text-xs rounded-xl border-2 border-emerald-500 bg-emerald-500/10 text-emerald-400 font-bold" data-diff="normal">보통</button>
                        <button class="diff-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300" data-diff="hard">매운맛</button>
                    </div>
                </div>

                <!-- Jump Sensitivity Select -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <label class="text-xs font-semibold text-slate-300">점프 반응 민감도 (세기)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="sens-btn py-1.5 text-xs rounded-xl border-2 border-amber-500 bg-amber-500/10 text-amber-400 font-bold" data-sens="soft">부드럽게</button>
                        <button class="sens-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300" data-sens="normal">보통</button>
                        <button class="sens-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300" data-sens="strong">강하게</button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch (e) {}
            }

            playScore() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {}
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } catch (e) {}
            }

            playItemCollect(value) {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const freq = value >= 10 ? 880 : (value >= 5 ? 659 : 523);
                    osc.frequency.setValueAtTime(freq, now);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {}
            }
        }

        const sound = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const startGameBtn = document.getElementById('startGameBtn');
        const restartGameBtn = document.getElementById('restartGameBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const liveScore = document.getElementById('liveScore');
        const finalScore = document.getElementById('finalScore');
        const finalBestScore = document.getElementById('finalBestScore');
        const bestScoreText = document.getElementById('bestScoreText');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValueText = document.getElementById('sizeValueText');
        const trailSelect = document.getElementById('trailSelect');
        const customEmojiInput = document.getElementById('customEmojiInput');
        const applyEmojiBtn = document.getElementById('applyEmojiBtn');
        const selectedSkinName = document.getElementById('selectedSkinName');

        // Skins Database
        const SKINS = {
            classic: { name: '클래식 버드', emoji: '🐥', type: 'emoji' },
            dragon: { name: '신비의 용', emoji: '🐉', type: 'emoji' },
            rocket: { name: '우주 로켓', emoji: '🚀', type: 'emoji' },
            ufo: { name: '에일리언 UFO', emoji: '🛸', type: 'emoji' },
            cat: { name: '날아라 야옹이', emoji: '😸', type: 'emoji' },
            ghost: { name: '꼬마 유령', emoji: '👻', type: 'emoji' },
            bat: { name: '야간 박쥐', emoji: '🦇', type: 'emoji' },
            unicorn: { name: '무지개 유니콘', emoji: '🦄', type: 'emoji' }
        };

        // Difficulty Presets (Gentler gravity & lower jump force for soft control)
        const DIFFICULTIES = {
            easy: { gap: 180, speed: 2.0, spawnInterval: 110, gravity: 0.22, jump: -4.3 },
            normal: { gap: 155, speed: 2.5, spawnInterval: 95, gravity: 0.28, jump: -5.0 },
            hard: { gap: 125, speed: 3.2, spawnInterval: 80, gravity: 0.38, jump: -6.0 }
        };

        const SENSITIVITY_MULTIPLIERS = {
            soft: 0.85,
            normal: 1.0,
            strong: 1.2
        };

        // Game State Variables
        let gameState = 'START';
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('flappy_best_score') || '0', 10);
        bestScoreText.textContent = bestScore;

        let selectedSkin = 'classic';
        let customEmoji = null;
        let characterSize = 34;
        let currentDifficulty = 'normal';
        let currentSens = 'soft';
        let trailEffect = 'bubbles';

        let frameCount = 0;
        let pipes = [];
        let particles = [];
        let bgStars = [];
        let clouds = [];
        let items = [];
        let floatingTexts = [];

        const ITEM_TYPES = [
            { type: 'coin', emoji: '🪙', value: 2, chance: 0.6, color: '#fbbf24' },
            { type: 'gem', emoji: '💎', value: 5, chance: 0.3, color: '#38bdf8' },
            { type: 'star', emoji: '⭐', value: 10, chance: 0.1, color: '#f59e0b' }
        ];

        class Item {
            constructor(x, y, itemType) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.type = itemType;
                this.radius = 16;
                this.collected = false;
                this.bobbingAngle = Math.random() * Math.PI * 2;
            }

            update() {
                const config = DIFFICULTIES[currentDifficulty];
                this.x -= config.speed;
                this.bobbingAngle += 0.08;
                this.y = this.baseY + Math.sin(this.bobbingAngle) * 6;
            }

            draw() {
                if (this.collected) return;
                ctx.save();
                ctx.translate(this.x, this.y);

                // Aura Glow
                const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
                auraGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                auraGrad.addColorStop(0.5, this.type.color + 'aa');
                auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();

                // Emoji Icon
                ctx.font = '20px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type.emoji, 0, 0);

                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 40;
                this.maxLife = 40;
            }

            update() {
                this.y -= 1.2;
                this.life--;
            }

            draw() {
                ctx.save();
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.globalAlpha = alpha;
                ctx.font = 'bold 22px Jua, sans-serif';
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        const player = {
            x: 80,
            y: 200,
            velocity: 0,
            rotation: 0,
            radius: 17,

            update() {
                const diffConfig = DIFFICULTIES[currentDifficulty];
                this.velocity += diffConfig.gravity;
                this.y += this.velocity;

                // Rotation based on velocity
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.07));

                // Generate trail particles
                if (trailEffect !== 'none' && gameState === 'PLAYING' && frameCount % 2 === 0) {
                    createTrailParticle(this.x - this.radius, this.y);
                }
            },

            jump() {
                const diffConfig = DIFFICULTIES[currentDifficulty];
                const sensMult = SENSITIVITY_MULTIPLIERS[currentSens] || 0.85;
                this.velocity = diffConfig.jump * sensMult;
                sound.playJump();
            },

            moveDown() {
                this.velocity = Math.max(this.velocity + 1.8, 2.0);
            },

            moveLeft() {
                const minX = canvas.width * 0.12;
                this.x = Math.max(minX, this.x - 10);
            },

            moveRight() {
                const maxX = canvas.width * 0.45;
                this.x = Math.min(maxX, this.x + 10);
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const currentSkin = customEmoji ? { emoji: customEmoji } : SKINS[selectedSkin];
                const emojiText = (currentSkin && currentSkin.emoji) ? currentSkin.emoji : '🐥';

                // 1. Highlight Back Aura (Ensures maximum visibility against all backgrounds)
                const glowRadius = Math.max(16, characterSize * 0.6);
                const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRadius);
                auraGrad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
                auraGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.3)');
                auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
                ctx.fill();

                // 2. Draw Character Emoji with dynamic sizing & full OS font fallbacks
                const fontSize = Math.max(16, characterSize);
                ctx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 3;
                
                ctx.fillText(emojiText, 0, 0);

                ctx.restore();
            }
        };

        function resizeCanvas() {
            const container = canvas.parentElement;
            const w = Math.max(container.clientWidth || 360, 280);
            const h = Math.max(container.clientHeight || 480, 360);
            
            canvas.width = w;
            canvas.height = h;
            player.x = canvas.width * 0.25;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Background initialization
        function initBackground() {
            bgStars = [];
            clouds = [];
            for (let i = 0; i < 25; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.6),
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4),
                    width: Math.random() * 80 + 60,
                    speed: Math.random() * 0.4 + 0.2
                });
            }
        }
        initBackground();

        class Pipe {
            constructor() {
                const config = DIFFICULTIES[currentDifficulty];
                this.x = canvas.width;
                this.width = 64;
                this.passed = false;

                // Gap positioning logic with fallback for small canvas height
                const minPipeHeight = 40;
                const groundHeight = 50;
                const availableHeight = Math.max(30, canvas.height - groundHeight - config.gap - (minPipeHeight * 2));
                this.topHeight = minPipeHeight + Math.random() * availableHeight;
                this.bottomY = this.topHeight + config.gap;
            }

            update() {
                const config = DIFFICULTIES[currentDifficulty];
                this.x -= config.speed;
            }

            draw() {
                // Pipe Gradients
                const gradTop = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
                gradTop.addColorStop(0, '#10b981'); // Emerald 500
                gradTop.addColorStop(0.5, '#34d399'); // Emerald 400
                gradTop.addColorStop(1, '#047857'); // Emerald 700

                // Top Pipe Body
                ctx.fillStyle = gradTop;
                ctx.beginPath();
                ctx.roundRect(this.x, 0, this.width, this.topHeight, [0, 0, 8, 8]);
                ctx.fill();

                // Top Pipe Rim
                ctx.fillStyle = '#059669';
                ctx.beginPath();
                ctx.roundRect(this.x - 4, this.topHeight - 24, this.width + 8, 24, 6);
                ctx.fill();
                ctx.strokeStyle = '#047857';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Bottom Pipe Body
                const bottomHeight = canvas.height - this.bottomY;
                ctx.fillStyle = gradTop;
                ctx.beginPath();
                ctx.roundRect(this.x, this.bottomY, this.width, bottomHeight, [8, 8, 0, 0]);
                ctx.fill();

                // Bottom Pipe Rim
                ctx.fillStyle = '#059669';
                ctx.beginPath();
                ctx.roundRect(this.x - 4, this.bottomY, this.width + 8, 24, 6);
                ctx.fill();
                ctx.stroke();
            }
        }

        // Particle system for trails & hits
        function createTrailParticle(x, y) {
            let color, size, vx, vy, life;

            if (trailEffect === 'bubbles') {
                color = `hsla(${Math.random() * 60 + 180}, 90%, 70%, `;
                size = Math.random() * 6 + 3;
                vx = -Math.random() * 1.5 - 0.5;
                vy = (Math.random() - 0.5) * 1;
                life = 30;
            } else if (trailEffect === 'fire') {
                color = `hsla(${Math.random() * 40 + 10}, 100%, 55%, `;
                size = Math.random() * 8 + 4;
                vx = -Math.random() * 2 - 1;
                vy = (Math.random() - 0.5) * 1.5;
                life = 20;
            } else if (trailEffect === 'rainbow') {
                color = `hsla(${(frameCount * 5) % 360}, 100%, 65%, `;
                size = Math.random() * 7 + 3;
                vx = -Math.random() * 1.5 - 0.5;
                vy = (Math.random() - 0.5) * 0.8;
                life = 35;
            } else if (trailEffect === 'feathers') {
                color = 'rgba(255, 255, 255, ';
                size = Math.random() * 4 + 2;
                vx = -Math.random() * 1.2 - 0.2;
                vy = Math.random() * 0.8 + 0.2;
                life = 40;
            } else {
                return;
            }

            particles.push({ x, y, vx, vy, size, color, life, maxLife: life });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3,
                    color: `hsla(${Math.random() * 50 + 10}, 100%, 50%, `,
                    life: 30,
                    maxLife: 30
                });
            }
        }

        function createItemParticles(x, y, color) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 5 + 2,
                    color: color.startsWith('#') ? color : '#f59e0b',
                    life: 25,
                    maxLife: 25
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                const alpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color + alpha + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Collision Check Algorithm
        function checkCollision() {
            const hitRadius = player.radius * 0.7; // Generous hitbox for fair gameplay

            // Ground & Ceiling collision
            const groundHeight = 50;
            if (player.y + hitRadius >= canvas.height - groundHeight) {
                return "바닥에 떨어졌습니다!";
            }
            if (player.y - hitRadius <= 0) {
                return "천장에 부딪혔습니다!";
            }

            // Pipe collision
            for (let pipe of pipes) {
                // Check if player is within pipe's X span
                if (player.x + hitRadius > pipe.x && player.x - hitRadius < pipe.x + pipe.width) {
                    // Check if player hits top pipe or bottom pipe
                    if (player.y - hitRadius < pipe.topHeight || player.y + hitRadius > pipe.bottomY) {
                        return "파이프에 충돌했습니다!";
                    }
                }
            }

            return null;
        }

        function drawBackground() {
            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0f172a'); // Slate 900
            skyGrad.addColorStop(0.6, '#1e1b4b'); // Indigo 950
            skyGrad.addColorStop(1, '#311042'); // Deep Violet

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = '#ffffff';
            for (let star of bgStars) {
                ctx.globalAlpha = star.alpha * (0.8 + 0.2 * Math.sin(frameCount * 0.05 + star.x));
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.globalAlpha = 1.0;

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            for (let cloud of clouds) {
                if (gameState === 'PLAYING') cloud.x -= cloud.speed;
                if (cloud.x + cloud.width < 0) cloud.x = canvas.width + 50;

                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width * 0.25, cloud.y - 10, cloud.width * 0.35, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width * 0.5, cloud.y, cloud.width * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Distant City / Mountains Silhouette
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 50);
            for (let i = 0; i <= canvas.width; i += 40) {
                const height = Math.sin(i * 0.01) * 30 + 40;
                ctx.lineTo(i, canvas.height - height - 50);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Ground Track
            const groundGrad = ctx.createLinearGradient(0, canvas.height - 50, 0, canvas.height);
            groundGrad.addColorStop(0, '#1e293b');
            groundGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Top border line of ground
            ctx.strokeStyle = '#38bdf8'; // Cyan accent line
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 50);
            ctx.lineTo(canvas.width, canvas.height - 50);
            ctx.stroke();
        }

        function gameLoop() {
            frameCount++;

            // Clear & Draw BG
            drawBackground();

            if (gameState === 'PLAYING') {
                // Update player
                player.update();

                // Spawn Pipes with a initial grace period (first pipe appears after frame 80)
                const diffConfig = DIFFICULTIES[currentDifficulty];
                if (frameCount > 80 && (frameCount - 80) % diffConfig.spawnInterval === 0) {
                    const newPipe = new Pipe();
                    pipes.push(newPipe);

                    if (Math.random() < 0.75) {
                        const rand = Math.random();
                        let selectedType = ITEM_TYPES[0]; // coin 60%
                        if (rand > 0.9) selectedType = ITEM_TYPES[2]; // star 10%
                        else if (rand > 0.6) selectedType = ITEM_TYPES[1]; // gem 30%

                        const gapCenter = newPipe.topHeight + (diffConfig.gap / 2);
                        const itemY = gapCenter + (Math.random() * 40 - 20);
                        const itemX = newPipe.x + newPipe.width / 2;

                        items.push(new Item(itemX, itemY, selectedType));
                    }
                }

                // Update & Draw Pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    const pipe = pipes[i];
                    pipe.update();
                    pipe.draw();

                    // Score calculation
                    if (!pipe.passed && pipe.x + pipe.width < player.x) {
                        pipe.passed = true;
                        score++;
                        liveScore.textContent = score;
                        sound.playScore();

                        // Visual bounce effect on score display
                        liveScore.classList.remove('scale-125');
                        void liveScore.offsetWidth;
                        liveScore.classList.add('scale-125');
                    }

                    // Remove offscreen pipes
                    if (pipe.x + pipe.width < -20) {
                        pipes.splice(i, 1);
                    }
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    item.update();
                    item.draw();

                    // Collision check with player
                    const dist = Math.hypot(player.x - item.x, player.y - item.y);
                    if (!item.collected && dist < player.radius + item.radius) {
                        item.collected = true;
                        score += item.type.value;
                        liveScore.textContent = score;
                        sound.playItemCollect(item.type.value);

                        floatingTexts.push(new FloatingText(item.x, item.y, `+${item.type.value}`, item.type.color));
                        createItemParticles(item.x, item.y, item.type.color);

                        // Visual bounce effect on live score
                        liveScore.classList.remove('scale-125');
                        void liveScore.offsetWidth;
                        liveScore.classList.add('scale-125');

                        items.splice(i, 1);
                        continue;
                    }

                    if (item.x + item.radius < -20) {
                        items.splice(i, 1);
                    }
                }

                // Update & Draw Floating Texts
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.update();
                    ft.draw();
                    if (ft.life <= 0) floatingTexts.splice(i, 1);
                }

                // Check collision
                const crashReason = checkCollision();
                if (crashReason) {
                    triggerGameOver(crashReason);
                }
            } else if (gameState === 'START') {
                // Idle gentle floating animation before start
                player.y = (canvas.height / 2) + Math.sin(frameCount * 0.06) * 12;
            }

            // Draw particles & player
            updateParticles();
            player.draw();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sound.init();
            resizeCanvas(); // Ensure bounds and player.x are accurately computed
            gameState = 'PLAYING';
            score = 0;
            frameCount = 0;
            pipes = [];
            particles = [];
            items = [];
            floatingTexts = [];
            
            // Set starting position cleanly in center-upper view
            player.y = canvas.height * 0.35;
            player.velocity = 0;
            player.jump(); // Initial upward bounce
            liveScore.textContent = '0';

            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            liveScore.classList.remove('hidden');
        }

        function triggerGameOver(reason) {
            sound.playHit();
            createExplosion(player.x, player.y);
            gameState = 'GAMEOVER';

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappy_best_score', bestScore.toString());
                bestScoreText.textContent = bestScore;
            }

            document.getElementById('gameOverReason').textContent = reason;
            finalScore.textContent = score;
            finalBestScore.textContent = bestScore;

            setTimeout(() => {
                liveScore.classList.add('hidden');
                gameOverOverlay.classList.remove('hidden');
            }, 400);
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.classList.add('hidden');
            }
        }

        function handleJumpAction(e) {
            if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) {
                return;
            }

            if (gameState === 'PLAYING') {
                player.jump();
            } else if (gameState === 'START') {
                startGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING' && (e.code === 'Space' || e.code.startsWith('Arrow'))) {
                e.preventDefault();
                handleJumpAction(e);
                return;
            }

            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                player.jump();
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                player.moveDown();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                player.moveLeft();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                player.moveRight();
            } else if (e.code === 'KeyP' || e.code === 'Escape') {
                togglePause();
            }
        });

        canvas.addEventListener('mousedown', handleJumpAction);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleJumpAction(e);
        }, { passive: false });

        startGameBtn.addEventListener('click', startGame);
        restartGameBtn.addEventListener('click', startGame);
        resumeBtn.addEventListener('click', togglePause);
        pauseBtn.addEventListener('click', togglePause);

        // Sound Mute Toggle
        soundToggleBtn.addEventListener('click', () => {
            sound.muted = !sound.muted;
            if (sound.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-slate-300';
            }
        });

        // Skin Button Selectors
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.skin-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-amber-400', 'bg-amber-500/10');
                });
                btn.classList.add('border-2', 'border-amber-400', 'bg-amber-500/10');
                
                selectedSkin = btn.getAttribute('data-skin');
                customEmoji = null;
                customEmojiInput.value = '';
                selectedSkinName.textContent = SKINS[selectedSkin].name;
            });
        });

        // Apply Custom Emoji
        applyEmojiBtn.addEventListener('click', () => {
            const inputVal = customEmojiInput.value.trim();
            if (inputVal) {
                customEmoji = inputVal;
                selectedSkinName.textContent = `커스텀 (${inputVal})`;
                document.querySelectorAll('.skin-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-amber-400', 'bg-amber-500/10');
                });
            }
        });

        // Size Slider Adjuster
        function updateCharacterSize(sizeVal) {
            characterSize = parseInt(sizeVal, 10);
            player.radius = characterSize / 2;

            let label = '보통';
            if (characterSize <= 25) label = '매우 작음';
            else if (characterSize <= 30) label = '작음';
            else if (characterSize <= 40) label = '보통';
            else if (characterSize <= 52) label = '크게';
            else label = '왕큼';

            sizeValueText.textContent = `${label} (${characterSize}px)`;
            sizeSlider.value = characterSize;
        }

        sizeSlider.addEventListener('input', (e) => {
            updateCharacterSize(e.target.value);
        });

        document.querySelectorAll('.preset-size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preset-size-btn').forEach(b => {
                    b.classList.remove('text-amber-400', 'border', 'border-amber-500/30', 'font-bold');
                });
                btn.classList.add('text-amber-400', 'border', 'border-amber-500/30', 'font-bold');
                updateCharacterSize(btn.getAttribute('data-size'));
            });
        });

        // Trail Selector
        trailSelect.addEventListener('change', (e) => {
            trailEffect = e.target.value;
        });

        // Difficulty Selector
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => {
                    b.className = 'diff-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300';
                });
                btn.className = 'diff-btn py-1.5 text-xs rounded-xl border-2 border-emerald-500 bg-emerald-500/10 text-emerald-400 font-bold';
                currentDifficulty = btn.getAttribute('data-diff');
            });
        });

        // Sensitivity Selector
        document.querySelectorAll('.sens-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sens-btn').forEach(b => {
                    b.className = 'sens-btn py-1.5 text-xs rounded-xl border border-slate-700 bg-slate-800 text-slate-300';
                });
                btn.className = 'sens-btn py-1.5 text-xs rounded-xl border-2 border-amber-500 bg-amber-500/10 text-amber-400 font-bold';
                currentSens = btn.getAttribute('data-sens');
            });
        });

        window.onload = () => {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
